<!DOCTYPE html>
<html lang="en">
<head>
  {COLOR_MODE_INIT}
  <meta charset="{CHARSET}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{PAGE_TITLE}{GALLERY_NAME}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.css">
  <link rel="stylesheet" href="{THEME_URL}style.css">
  <link rel="stylesheet" href="{THEME_URL}custom.css">
</head>
<body class="fs-body">

  <div class="fs-page">

    <!-- ── Banner ────────────────────────────────────────────────────────────── -->
    <header class="fs-banner">
      <div class="fs-banner-text">
        <h1 class="fs-banner-title">{GALLERY_NAME}</h1>
        <p class="fs-banner-desc">{GALLERY_DESCRIPTION}</p>
      </div>
    </header>

    <!-- ── Navigation ────────────────────────────────────────────────────────── -->
    <nav class="fs-nav" aria-label="Site navigation">
      <div class="fs-nav-inner">
        {NAVIGATION}
        <span class="fs-nav-admin">{COLOR_MODE_TOGGLE}{ADMIN_LINK}</span>
      </div>
    </nav>

    <!-- ── Main content ──────────────────────────────────────────────────────── -->
    <main class="fs-main">
      {CONTENT}
    </main>

    <!-- ── Footer ────────────────────────────────────────────────────────────── -->
    <footer class="fs-footer">
      {POWERED_BY}
    </footer>

  </div><!-- .fs-page -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
